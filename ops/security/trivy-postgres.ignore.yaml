vulnerabilities:
  - id: CVE-2025-68121
    paths:
      - "usr/local/bin/gosu"
    expired_at: 2026-10-07
    statement: >-
      Scoped exception for gosu 1.19 in the pinned official postgres:18 image.
      CVE-2025-68121 affects Go crypto/tls session resumption. gosu is used only
      as a privilege-drop helper during container startup and does not invoke
      the affected TLS functionality. Re-evaluate on PostgreSQL/gosu image
      refresh or by the expiry date.
