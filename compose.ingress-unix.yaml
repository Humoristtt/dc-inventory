# Explicit opt-in only. Never deploy without CP-07 approval.
# INGRESS_HOST_DIR must be a pre-created, access-controlled absolute host path.
services:
  web:
    # Fail closed if the old TCP Tunnel origin is left in place.
    ports: !reset []
    # Replace the local-only writable socket directory.
    tmpfs: !override
      - /tmp
    volumes:
      - type: bind
        source: ${INGRESS_HOST_DIR:?Set an approved absolute host directory}
        target: /run/dc-inventory
        read_only: false
        bind:
          create_host_path: false
