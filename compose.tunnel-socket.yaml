# Подключать только при подготовленном защищённом каталоге сокета.
# Обычный compose.yaml не меняется.
services:
  web:
    volumes:
      - type: bind
        source: ${TUNNEL_SOCKET_DIR:?Set absolute host socket directory}
        target: /run/dc-inventory
        bind:
          create_host_path: false
