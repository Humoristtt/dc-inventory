name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dc_inventory
          POSTGRES_USER: dc_inventory
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dc_inventory -d dc_inventory"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://dc_inventory:ci-only-password@127.0.0.1:5432/dc_inventory
      DATABASE_CONNECT_TIMEOUT_SECONDS: "5"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Ruff
        working-directory: backend
        run: ruff check app tests migrations

      - name: mypy
        working-directory: backend
        run: mypy app tests migrations/env.py migrations/versions

      - name: Tests
        working-directory: backend
        run: pytest -q

      - name: Migrations
        working-directory: backend
        run: |
          alembic upgrade head
          alembic current

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  containers:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend
        run: docker build -t dc-inventory-backend:ci ./backend

      - name: Build web
        run: docker build -t dc-inventory-web:ci ./frontend
