name: dc-inventory

x-backend-image: &backend-image
  image: dc-inventory-backend:local
  build:
    context: ./backend

x-backend-environment: &backend-environment
  APP_ENV: production
  DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-5}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
  DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-5}
  DATABASE_STATEMENT_TIMEOUT_SECONDS: ${DATABASE_STATEMENT_TIMEOUT_SECONDS:-30}
  DATABASE_LOCK_TIMEOUT_SECONDS: ${DATABASE_LOCK_TIMEOUT_SECONDS:-5}
  MIGRATION_STATEMENT_TIMEOUT_SECONDS: ${MIGRATION_STATEMENT_TIMEOUT_SECONDS:-300}
  MIGRATION_LOCK_TIMEOUT_SECONDS: ${MIGRATION_LOCK_TIMEOUT_SECONDS:-5}

services:
  postgres:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - db_net
    restart: unless-stopped

  migrate:
    <<: *backend-image
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - db_net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  db-permissions:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      RUNTIME_DB_USER: ${POSTGRES_RUNTIME_USER}
      RUNTIME_DB_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD}
      WORKER_DB_USER: ${POSTGRES_WORKER_USER}
      WORKER_DB_PASSWORD: ${POSTGRES_WORKER_PASSWORD}
      MAINTENANCE_DB_USER: ${POSTGRES_MAINTENANCE_USER}
      MAINTENANCE_DB_PASSWORD: ${POSTGRES_MAINTENANCE_PASSWORD}
    command:
      - /bin/sh
      - -ec
      - |
        test -n "$$RUNTIME_DB_USER"
        test -n "$$RUNTIME_DB_PASSWORD"
        test -n "$$WORKER_DB_USER"
        test -n "$$WORKER_DB_PASSWORD"
        test -n "$$MAINTENANCE_DB_USER"
        test -n "$$MAINTENANCE_DB_PASSWORD"

        test "$$RUNTIME_DB_USER" != "$$WORKER_DB_USER"
        test "$$RUNTIME_DB_USER" != "$$MAINTENANCE_DB_USER"
        test "$$WORKER_DB_USER" != "$$MAINTENANCE_DB_USER"

        test "$$RUNTIME_DB_USER" != "$$PGUSER"
        test "$$WORKER_DB_USER" != "$$PGUSER"
        test "$$MAINTENANCE_DB_USER" != "$$PGUSER"

        psql           -v ON_ERROR_STOP=1           -v runtime_user="$$RUNTIME_DB_USER"           -v runtime_password="$$RUNTIME_DB_PASSWORD"           -v worker_user="$$WORKER_DB_USER"           -v worker_password="$$WORKER_DB_PASSWORD" -v maintenance_user="$$MAINTENANCE_DB_USER" -v maintenance_password="$$MAINTENANCE_DB_PASSWORD"           -f /scripts/apply_database_permissions.sql
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./backend/scripts/apply_database_permissions.sql:/scripts/apply_database_permissions.sql:ro
    networks:
      - db_net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  backend:
    <<: *backend-image
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_RUNTIME_USER}:${POSTGRES_RUNTIME_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-300}
      ADMIN_TELEGRAM_USER_ID: ${ADMIN_TELEGRAM_USER_ID:-}
      SUPPORT_TELEGRAM_USERNAME: ${SUPPORT_TELEGRAM_USERNAME:-Humoristttt}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-43200}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-dc_inventory_session}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_WEB_APP_URL: ${TELEGRAM_WEB_APP_URL:-https://app.spik-inventory.ru}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db-permissions:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - app_net
      - db_net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 20s
    restart: unless-stopped

  telegram-worker:
    <<: *backend-image
    command: ["python", "-m", "app.modules.notifications.worker"]
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_WORKER_USER}:${POSTGRES_WORKER_PASSWORD}@postgres:5432/${POSTGRES_DB}
      TELEGRAM_GATEWAY_URL: ${TELEGRAM_GATEWAY_URL:-}
      TELEGRAM_GATEWAY_SECRET: ${TELEGRAM_GATEWAY_SECRET:-}
      TELEGRAM_GATEWAY_TIMEOUT_SECONDS: ${TELEGRAM_GATEWAY_TIMEOUT_SECONDS:-10}
      NOTIFICATION_WORKER_POLL_SECONDS: ${NOTIFICATION_WORKER_POLL_SECONDS:-2}
      NOTIFICATION_WORKER_CLAIM_TTL_SECONDS: ${NOTIFICATION_WORKER_CLAIM_TTL_SECONDS:-60}
      NOTIFICATION_WORKER_BATCH_SIZE: ${NOTIFICATION_WORKER_BATCH_SIZE:-10}
      NOTIFICATION_WORKER_MAX_ATTEMPTS: ${NOTIFICATION_WORKER_MAX_ATTEMPTS:-8}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db-permissions:
        condition: service_completed_successfully
    networks:
      - db_net
      - egress_net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 20s
    restart: unless-stopped

  maintenance-worker:
    <<: *backend-image
    command: ["python", "-m", "app.maintenance.worker"]
    environment:
      <<: *backend-environment
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_MAINTENANCE_USER}:${POSTGRES_MAINTENANCE_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_POOL_SIZE: "1"
      DATABASE_MAX_OVERFLOW: "0"
      MAINTENANCE_WORKER_POLL_SECONDS: ${MAINTENANCE_WORKER_POLL_SECONDS:-3600}
      MAINTENANCE_RETENTION_BATCH_SIZE: ${MAINTENANCE_RETENTION_BATCH_SIZE:-1000}
      AUTH_SESSION_RETENTION_DAYS: ${AUTH_SESSION_RETENTION_DAYS:-7}
      TELEGRAM_UPDATE_RETENTION_DAYS: ${TELEGRAM_UPDATE_RETENTION_DAYS:-30}
      NOTIFICATION_OUTBOX_RETENTION_DAYS: ${NOTIFICATION_OUTBOX_RETENTION_DAYS:-90}
      ACCESS_CALLBACK_RETENTION_DAYS: ${ACCESS_CALLBACK_RETENTION_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      db-permissions:
        condition: service_completed_successfully
    networks:
      - db_net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 20s
    restart: unless-stopped

  web:
    image: dc-inventory-web:local
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O - http://127.0.0.1:8080/healthz | grep -q '^ok$'
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - app_net
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app_net:
  egress_net:
  db_net:
    internal: true
