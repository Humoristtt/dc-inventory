# Production direct-ingress override.
# INGRESS_HOST_DIR must be a pre-created, access-controlled absolute host path.
services:
  web:
    # Production traffic enters through host Nginx and the Unix socket only.
    # Never publish the container TCP listener when this override is active.
    ports: !reset []
    # Base/dev keeps ingress_net for the localhost TCP listener.
    # Production receives traffic through the Unix socket only.
    networks: !override
      - app_net
    # Replace the image-local socket tmpfs with the controlled host bind mount.
    tmpfs: !override
      - /tmp
    volumes:
      - type: bind
        source: ${INGRESS_HOST_DIR:?Set an approved absolute host directory}
        target: /run/dc-inventory
        read_only: false
        bind:
          create_host_path: false
