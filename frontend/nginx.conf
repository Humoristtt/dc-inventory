worker_processes auto;

pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    server_tokens off;
    sendfile on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    resolver 127.0.0.11 valid=10s ipv6=off;

    map $uri $api_rate_key {
        default $remote_addr;
        /api/telegram/webhook "";
    }

    map "$request_method:$uri" $sensitive_rate_key {
        default "";
        POST:/api/auth/telegram $remote_addr;
        POST:/api/access-requests $remote_addr;
    }

    map $uri $telegram_webhook_rate_key {
        default "";
        /api/telegram/webhook $remote_addr;
    }

    limit_req_zone $api_rate_key zone=api_per_client:5m rate=30r/s;
    limit_req_zone $sensitive_rate_key zone=sensitive_per_client:5m rate=10r/m;
    limit_req_zone $telegram_webhook_rate_key zone=telegram_webhook:5m rate=50r/s;
    limit_req_status 429;

    # TCP: локальная проверка, никакого доверия клиентским IP-заголовкам.
    server {
        listen 8080;
        server_name _;

        set $forwarded_proto $scheme;

        include /etc/nginx/server-common.inc;
    }

    # Доверенный ingress: только Unix-сокет с ограниченным доступом.
    #
    # Host Nginx всегда перезаписывает X-Real-IP своим $remote_addr.
    # Поэтому клиент не может подменить адрес заголовком из внешнего запроса.
    # Доверять CF-Connecting-IP здесь нельзя: Cloudflare Tunnel больше не
    # является production ingress.
    server {
        listen unix:/run/dc-inventory/ingress.sock;
        server_name _;

        set_real_ip_from unix:;
        real_ip_header X-Real-IP;

        # TLS завершается на production host Nginx.
        set $forwarded_proto https;

        include /etc/nginx/server-common.inc;
    }
}
